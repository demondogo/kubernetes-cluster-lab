---
# Binary staging
control_plane_source_directory: /home/vagrant/kubernetes-the-hard-way/downloads/controller
control_plane_staging_directory: /tmp/kubernetes-lab-control-plane

# Installation paths
kubernetes_binary_directory: /usr/local/bin
kubernetes_config_directory: /var/lib/kubernetes
kubernetes_system_config_directory: /etc/kubernetes/config

# API server
kubernetes_api_bind_address: "0.0.0.0"
kubernetes_api_port: 6443
kubernetes_api_hostname: server.kubernetes.local

# Networking
kubernetes_cluster_cidr: "10.200.0.0/16"
kubernetes_service_cidr: "10.32.0.0/24"
kubernetes_node_port_range: "30000-32767"

# etcd
kubernetes_etcd_servers: "http://127.0.0.1:2379"

# Logging
kubernetes_log_level: 2