---
- name: Install base OS packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure Kubernetes lab host entries
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} KUBERNETES LAB"
    block: |
      192.168.56.10 jumpbox
      192.168.56.20 server
      192.168.56.50 node-0
      192.168.56.60 node-1

- name: Configure kernel modules to load at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/kubernetes.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      overlay
      br_netfilter

- name: Load required kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: "{{ kubernetes_kernel_modules }}"

- name: Configure Kubernetes networking sysctl parameters
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1
  notify: Reload sysctl